<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Runtime title, favicon, and SEO metadata are loaded from site_settings. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Memuat situs</title>
    <script>
      (async () => {
        try {
          const response = await fetch("/api/cms/site-settings", {
            headers: { Accept: "application/json" },
          });
          if (!response.ok) return;

          const payload = await response.json();
          const settings = Array.isArray(payload?.data) ? payload.data : [];
          const getValue = (key) => {
            const setting = settings.find((item) => item?.key === key);
            return setting?.value && typeof setting.value === "object" ? setting.value : {};
          };
          const branding = getValue("branding");
          const seo = getValue("seo");
          const companyName = typeof branding.company_name === "string" ? branding.company_name : "";
          const tagline = typeof branding.tagline === "string" ? branding.tagline : "";
          const configuredTitle =
            typeof seo.site_title === "string" && seo.site_title.trim()
              ? seo.site_title.trim()
              : [companyName, tagline].filter(Boolean).join(" - ");

          if (configuredTitle) document.title = configuredTitle;

          if (typeof branding.favicon_url === "string" && branding.favicon_url.trim()) {
            document.querySelectorAll("link[rel*='icon']").forEach((link) => link.remove());
            const favicon = document.createElement("link");
            favicon.rel = "icon";
            favicon.href = branding.favicon_url.trim();
            document.head.appendChild(favicon);
          }
        } catch {
          // React SEO applies the same database settings after the app mounts.
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
